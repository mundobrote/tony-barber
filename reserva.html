<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reservar Turno | TH Barber Club</title>
  <link rel="icon" href="./img/logo.svg" type="image/x-icon" />
  <link rel="stylesheet" href="./css/styles.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" />
</head>
<body class="page-booking">

  <!-- 1. Fondo Global Fijo con Overlay Unificado -->
  <div class="global-bg-fixed" aria-hidden="true">
    <img src="./img/fotofondo.jpg" alt="Fondo TH Barber Club" class="global-bg-img" />
    <div class="global-bg-overlay"></div>
  </div>

  <!-- 2. Botón Volver Flotante Superior -->
  <header class="booking-top-nav">
    <a href="index.html" class="btn-back-floating">
      <i class="bi bi-chevron-left"></i>
      <span>Volver al Inicio</span>
    </a>
  </header>

  <!-- 3. Tarjeta Centralizada de Reserva (Glassmorphism) -->
  <main class="booking-wrapper">
    <section class="glass-booking-card">
      
      <!-- Logo centrado y títulos -->
      <div class="booking-card-header">
        <a href="index.html">
          <img src="./img/logo.svg" alt="TH Barber Club" class="card-logo" />
        </a>
        <div class="tag-pill">Agenda Online</div>
        <h1 class="card-title">¡Reserva tu turno!</h1>
        <p class="card-subtitle">Selecciona el servicio y horario de tu preferencia.</p>
      </div>

      <!-- Formulario Multi-pasos -->
      <form id="form-turno" autocomplete="off" onsubmit="return false;">
        
        <!-- ===== PASO 1: SERVICIO ===== -->
        <div class="seccion activa form-step" id="paso-1">
          <div class="form-group-lux">
            <label for="servicio" class="label-lux">Servicio *</label>
            <div class="select-wrapper">
              <select class="input-lux select-lux" id="servicio" required>
                <option value="">-- Selecciona un servicio --</option>
                <!-- Se cargará dinámicamente desde el panel de administración -->
              </select>
            </div>
          </div>
          
          <button type="button" class="btn-lux-primary w-100" onclick="siguientePaso(1)">
            Siguiente <i class="bi bi-arrow-right ms-1"></i>
          </button>
        </div>

        <!-- ===== PASO 2: FECHA Y HORA ===== -->
        <div class="seccion form-step" id="paso-2">
          <div class="form-group-lux">
            <label for="fecha" class="label-lux">Fecha *</label>
            <input type="date" class="input-lux input-date-lux" id="fecha" required onchange="cargarHorariosDisponibles()" />
          </div>

          <div class="form-group-lux">
            <label class="label-lux">Horarios Disponibles *</label>
            <div id="horarios" class="horarios-container">
              <span class="horarios-hint">Elige una fecha para ver horarios disponibles.</span>
            </div>
          </div>

          <div class="btn-group-lux">
            <button type="button" class="btn-lux-outline" onclick="volverPaso(1)">
              <i class="bi bi-arrow-left me-1"></i> Atrás
            </button>
            <button type="button" class="btn-lux-primary flex-1" onclick="siguientePaso(2)">
              Siguiente <i class="bi bi-arrow-right ms-1"></i>
            </button>
          </div>
        </div>

        <!-- ===== PASO 3: DATOS PERSONALES ===== -->
        <div class="seccion form-step" id="paso-3">
          <div class="form-row-lux">
            <div class="form-group-lux">
              <label for="nombre" class="label-lux">Nombre *</label>
              <input type="text" class="input-lux" id="nombre" placeholder="Tu nombre" required />
            </div>
            <div class="form-group-lux">
              <label for="apellido" class="label-lux">Apellido *</label>
              <input type="text" class="input-lux" id="apellido" placeholder="Tu apellido" required />
            </div>
          </div>

          <div class="form-row-lux">
            <div class="form-group-lux">
              <label for="telefono" class="label-lux">Teléfono *</label>
              <input type="tel" class="input-lux" id="telefono" placeholder="9 8412 0788" required />
            </div>
            <div class="form-group-lux">
              <label for="email" class="label-lux">Correo Electrónico *</label>
              <input type="email" class="input-lux" id="email" placeholder="correo@ejemplo.com" required />
            </div>
          </div>

          <div class="btn-group-lux">
            <button type="button" class="btn-lux-outline" onclick="volverPaso(2)">
              <i class="bi bi-arrow-left me-1"></i> Atrás
            </button>
            <button type="button" class="btn-lux-primary flex-1" onclick="enviarForm()">
              Confirmar Reserva <i class="bi bi-check2-circle ms-1"></i>
            </button>
          </div>
        </div>

      </form>
    </section>
  </main>

  <script src="./js/scripts.js"></script>
  <script>
    // Cargar servicios dinámicamente desde el localStorage compartido con el panel
    document.addEventListener("DOMContentLoaded", function() {
      const selectServicio = document.getElementById("servicio");
      if (!selectServicio) return;

      const SERVICIOS_DEFAULT = [
        { id: 1, tipo: "Corte Clásico / Tradicional", precio: 10000 },
        { id: 2, tipo: "Perfilado & Afeitado de Barba", precio: 7000 },
        { id: 3, tipo: "Combo Corte + Barba Completo", precio: 15000 },
        { id: 4, tipo: "Corte Infantil / Escolar", precio: 8000 },
        { id: 5, tipo: "Tintura / Camuflaje de Canas", precio: 18000 },
        { id: 6, tipo: "Corte VIP a Domicilio", precio: 25000 }
      ];

      let servicios = JSON.parse(localStorage.getItem("servicios_barberia"));
      if (!servicios || servicios.length === 0) {
        servicios = SERVICIOS_DEFAULT;
        localStorage.setItem("servicios_barberia", JSON.stringify(servicios));
      }

      // Limpiar y poblar el select
      selectServicio.innerHTML = '<option value="">-- Selecciona un servicio --</option>';
      servicios.forEach(s => {
        const option = document.createElement("option");
        option.value = s.id;
        option.setAttribute("data-precio", s.precio);
        option.textContent = `${s.tipo} — $${Number(s.precio).toLocaleString("es-CL")}`;
        selectServicio.appendChild(option);
      });
    });
  </script>
</body>
</html>
