<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contacto - TH Barber Club</title>
  <link rel="icon" href="./img/logo.svg" type="image/x-icon" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="./css/styles.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" />
</head>
<body>
  <div class="container py-5">
    <!-- Logo y encabezado -->
    <header class="text-center mb-4">
      <a href="index.html" class="d-inline-block mb-3">
        <img src="./img/logo.svg" alt="Logo de TH Barber Club" style="max-width: 150px;" />
      </a>
      <h1 class="fw-bold text-white">Contacto</h1>
      <p class="lead text-muted">Elegí el canal que prefieras para comunicarte con nosotros.</p>
    </header>

    <!-- Ilustración decorativa -->
    <div class="text-center mb-5">
      <img src="./img/contacto.svg" alt="Ilustración de contacto" class="img-fluid" style="max-width: 320px" />
    </div>

    <!-- Opciones de contacto -->
    <div class="row justify-content-center g-4">
      <!-- WhatsApp Directo -->
      <div class="col-12 col-md-6">
        <a href="https://wa.me/56984120788?text=Hola,%20quiero%20hacer%20una%20consulta%20sobre%20los%20servicios" 
           target="_blank" 
           class="btn btn-outline-success w-100 py-3 d-flex align-items-center justify-content-center gap-2 shadow-sm">
          <i class="bi bi-whatsapp fs-4"></i>
          <span>Enviar mensaje por WhatsApp</span>
        </a>
      </div>

      <!-- Instagram -->
      <div class="col-12 col-md-6">
        <a href="https://instagram.com" 
           target="_blank" 
           class="btn btn-outline-danger w-100 py-3 d-flex align-items-center justify-content-center gap-2 shadow-sm">
          <i class="bi bi-instagram fs-4"></i>
          <span>Ver perfil en Instagram</span>
        </a>
      </div>

      <!-- Volver al Inicio -->
      <div class="col-12 text-center mt-4">
        <a href="index.html" class="btn btn-secundario px-4 py-2">
          ← Volver al inicio
        </a>
      </div>
    </div>
  </div>
</body>
</html>
