<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Iniciar Sesión - TH Barber Club</title>
  <link rel="icon" href="../img/logo.svg" type="image/x-icon" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="../css/styles.css" rel="stylesheet" />
</head>
<body>
  <div class="container-fluid min-vh-100 d-flex align-items-center justify-content-center py-4">
    <div class="row w-100 justify-content-center">
      <div class="col-12 col-md-6 col-lg-4">
        
        <!-- Header con logo -->
        <div class="text-center mb-4">
          <a href="../index.html" class="d-inline-block mb-3">
            <img src="../img/logo.svg" alt="TH Barber Club" class="img-fluid" style="max-height: 80px;" />
          </a>
          <h1 class="h3 mb-2 fw-bold text-white">¡Bienvenido de vuelta 💈!</h1>
          <p class="text-muted">Panel de Administración de Barbería</p>
        </div>

        <!-- Formulario de login -->
        <form id="loginForm" class="needs-validation" novalidate>
          
          <!-- Email -->
          <div class="mb-3">
            <label for="email" class="form-label text-white">Correo electrónico</label>
            <input type="email" 
                   class="form-control" 
                   id="email" 
                   autocomplete="email" 
                   placeholder="manzana@gmail.com"
                   required />
            <div class="invalid-feedback">
              Por favor, ingresa un correo electrónico válido.
            </div>
          </div>

          <!-- Contraseña -->
          <div class="mb-4">
            <label for="password" class="form-label text-white">Contraseña</label>
            <div class="position-relative">
              <input type="password" 
                     class="form-control" 
                     id="password" 
                     autocomplete="current-password" 
                     placeholder="••••••••"
                     required />
              <button type="button" 
                      class="btn btn-link position-absolute end-0 top-50 translate-middle-y me-2 p-1 text-decoration-none" 
                      id="togglePassword"
                      style="color: #ff6600;">
                👁️
              </button>
            </div>
            <div class="invalid-feedback">
              La contraseña es obligatoria.
            </div>
          </div>

          <!-- Recordarme y Volver -->
          <div class="d-flex justify-content-between align-items-center mb-4">
            <div class="form-check">
              <input class="form-check-input" 
                     type="checkbox" 
                     id="rememberMe"
                     style="border-color: #ff6600;" />
              <label class="form-check-label small text-white" for="rememberMe">
                Recordarme
              </label>
            </div>
            <a href="../index.html" class="text-decoration-none small" style="color: #ff6600;">
              ← Volver al sitio
            </a>
          </div>

          <!-- Botón de login -->
          <button type="submit" class="btn btn-primario w-100 py-3 mb-4">
            <span class="login-text">Iniciar Sesión</span>
            <div class="spinner-border spinner-border-sm d-none" role="status">
              <span class="visually-hidden">Cargando...</span>
            </div>
          </button>
          
        </form>

        <!-- Footer -->
        <div class="text-center mt-4">
          <div class="d-flex justify-content-center gap-3 mb-2">
            <a href="../contacto.html" class="text-muted small text-decoration-none">Contacto</a>
            <span class="text-muted small">•</span>
            <a href="../reserva.html" class="text-muted small text-decoration-none">Reservas</a>
          </div>
          <p class="text-muted small mb-0">© 2026 TH Barber Club. Todos los derechos reservados.</p>
        </div>

      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./login.js"></script>
</body>
</html>
